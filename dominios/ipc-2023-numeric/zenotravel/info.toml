# Collection card (see docs/en/catalog.md) · Ficha de la colección (ver docs/es/catalogo.md).

title = "ZenoTravel (numeric)"
description = "Aviones que transportan personas entre ciudades y gastan combustible según la velocidad."
description-en = "Planes carrying people between cities and burning fuel according to their speed."

[origin]
source = "IPC 2023 (numeric)"
repository = "https://github.com/ipc2023-numeric/ipc2023-dataset"
commit = "0799944"
path = "zenotravel"
# Source files: {n} is the problem number and {nn} the same with two digits.
# Ficheros de origen: {n} es el número del problema y {nn}, el mismo con dos cifras.
domain = "domain.pddl"
problems = "instances/pfile{n}.pddl"
instances = 20

[[errata]]
kind = "requirements"  # (*)
files = ["domain.pddl"]
description = "La línea `:requirements` venía comentada, aunque el dominio usa tipos y fluentes numéricos. Se ha descomentado."
description-en = "The `:requirements` line was commented out, although the domain uses types and numeric fluents. It has been uncommented."
