# Collection card (see docs/en/catalog.md) · Ficha de la colección (ver docs/es/catalogo.md).

title = "Parking (Sequential, Satisficing)"
description = "Aparcar coches en fila reorganizándolos en las plazas de una calle."
description-en = "Parking cars in a row by rearranging them in the curb locations of a street."

[origin]
source = "IPC 2011"
repository = "https://github.com/potassco/pddl-instances"
commit = "cf19edf"
path = "ipc-2011/domains/parking-sequential-satisficing"
# Source files: {n} is the problem number and {nn} the same with two digits.
# Ficheros de origen: {n} es el número del problema y {nn}, el mismo con dos cifras.
domain = "domain.pddl"
problems = "instances/instance-{n}.pddl"
instances = 20

[[errata]]
kind = "other"  # (‡)
files = ["p*.pddl"]
description = "Los problemas se llamaban igual que el dominio; pasan a `parking-pNN`."
description-en = "The problems had the same name as the domain; they become `parking-pNN`."
