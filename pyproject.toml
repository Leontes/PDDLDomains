[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pddldomains"
version = "0.1.0"
description = "PDDL domain catalog with tools to classify domains, build test datasets, check them and generate problems"
readme = "README.md"
requires-python = ">=3.12"
# MIT para el código; los PDDL de terceros de dominios/ conservan sus condiciones (LICENCIAS.md).
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "José Segura", email = "josesegmur@ugr.es" }]
# Sin dependencias: solo la biblioteca estándar (tomllib incluido).
dependencies = []

[project.optional-dependencies]
# Módulos que necesita el generador de labyrinth de la IPC 2023 (solo para dibujar).
generators = [
    "drawsvg",
    "networkx",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
pddldomains = "pddldomains.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pddldomains = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# La tabla de traducciones tiene textos largos que no se pueden partir.
"src/pddldomains/translations.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
